name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test
        env:
          # Tests use fully-mocked providers — no real API keys or DB needed
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ci-test-key
          DATABASE_URL: postgresql://test:test@localhost/test
          DIRECT_URL: postgresql://test:test@localhost/test
          REDIS_URL: redis://localhost:6379
          ADMIN_API_KEY: ci-test-admin-key-32chars-xxxxx
          LLM_MODEL: gemini-2.0-flash
          EMBEDDING_MODEL: gemini-embedding-001
          EMBEDDING_DIMENSIONS: "768"
          MIN_SIMILARITY: "0.5"
          HYBRID_RRF_K: "60"
          PORT: "4000"
